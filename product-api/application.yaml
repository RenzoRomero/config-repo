spring:
  application:
    name: product-api

  profiles:
    active: dev

  graphql:
    graphiql:
        enabled: true

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  cache:
    type: redis

management:
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true





